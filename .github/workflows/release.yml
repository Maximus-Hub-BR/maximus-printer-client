# Publica o instalador do Print Client: Windows e macOS.
#
# ⚠️ **O Windows roda em `windows-latest`, e isso não é preferência.** O
# instalador NSIS precisa EXECUTAR o próprio stub para embutir o payload; num
# Mac ARM isso depende de wine sob qemu, que aborta
# (`anon_mmap_fixed: Assertion !((UINT_PTR)start & host_page_mask)`) e deixa
# um `.exe` de 153 KB sem conteúdo — um instalador que parece pronto e não é.
# Tentado em 09/10/2026 antes de criar este workflow.
#
# ⚠️ **O Mac roda em `macos-latest` e sobe DEPOIS do Windows.** O
# electron-builder do Windows cria o release (`vX.Y.Z`, `.exe` e `latest.yml`).
# O job do Mac não publica sozinho: anexa `.dmg`, `.zip` e `latest-mac.yml` no
# release que já existe. Os dois ao mesmo tempo disputam a criação do release.
#
# ⚠️ O Developer ID da VCZ existe no Mac do Leonardo (keychain), não no
# runner. `identity: null` continua de propósito: o Actions não acha o
# certificado e, se assinar com Apple Distribution, o Gatekeeper diz que o
# app está danificado. O job do Mac sobe o DMG sem assinatura. Quem publica
# a versão que abre em qualquer Mac substitui depois, com `gh release upload
# --clobber`, o `.dmg`, o `.zip`, os blockmaps e o `latest-mac.yml` gerados
# neste Mac com notarização.
#
# ⚠️ `GITHUB_TOKEN` é o do próprio Actions: o electron-builder cria o release
# e sobe `.exe` + `latest.yml`, que é o arquivo que o `electron-updater`
# consulta nos clientes Windows. O Mac consulta `latest-mac.yml`. Sem o yml
# da plataforma, ninguém daquela plataforma atualiza.
name: release

on:
  workflow_dispatch:
    inputs:
      versao:
        description: 'Versão a publicar (ex.: 1.0.4) — tem de bater com o package.json'
        required: true

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # A fila de impressão e a junção de PDF têm teste puro — barato rodar
      # aqui, e é o que impede publicar um cliente que perde etiqueta.
      - name: Testes
        run: npm test

      - name: Conferir a versão
        shell: bash
        run: |
          atual=$(node -p "require('./package.json').version")
          if [ "$atual" != "${{ inputs.versao }}" ]; then
            echo "package.json está em $atual e o disparo pediu ${{ inputs.versao }}"
            exit 1
          fi

      - name: Build e publicação
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --x64 --publish always

  mac:
    runs-on: macos-latest
    needs: windows
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Testes
        run: npm test

      - name: Conferir a versão
        run: |
          atual=$(node -p "require('./package.json').version")
          if [ "$atual" != "${{ inputs.versao }}" ]; then
            echo "package.json está em $atual e o disparo pediu ${{ inputs.versao }}"
            exit 1
          fi

      - name: Build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --mac --universal --publish never

      - name: Publicar no release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ inputs.versao }}"
          shopt -s nullglob
          arquivos=(dist/*.dmg dist/*.zip dist/*.dmg.blockmap dist/*.zip.blockmap dist/latest-mac.yml)
          if [ ${#arquivos[@]} -eq 0 ]; then
            echo "nenhum artefato Mac em dist/"
            ls -la dist || true
            exit 1
          fi
          gh release upload "$tag" "${arquivos[@]}" --clobber --repo "${{ github.repository }}"
