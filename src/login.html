<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MaximusHub Print Client</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f1117; color: #e8eaf0;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; height: 100vh; padding: 24px;
    }
    .logo { font-size: 28px; font-weight: 700; color: #4f8ef7; margin-bottom: 6px; }
    .subtitle { font-size: 13px; color: #7a8196; margin-bottom: 36px; }
    .card {
      background: #1a1e2a; border-radius: 12px; padding: 28px;
      width: 100%; max-width: 340px; border: 1px solid #252a38;
    }
    label { font-size: 12px; color: #9aa3b5; display: block; margin-bottom: 6px; }
    input {
      width: 100%; padding: 10px 12px; background: #0f1117;
      border: 1px solid #2e3447; border-radius: 8px; color: #e8eaf0;
      font-size: 14px; outline: none; transition: border-color .2s;
      margin-bottom: 16px;
    }
    input:focus { border-color: #4f8ef7; }
    button {
      width: 100%; padding: 11px; background: #4f8ef7; color: #fff;
      border: none; border-radius: 8px; font-size: 14px; font-weight: 600;
      cursor: pointer; transition: background .2s;
    }
    button:hover:not(:disabled) { background: #3a78e8; }
    button:disabled { opacity: .5; cursor: default; }
    .error {
      background: #2a1a1a; border: 1px solid #6b2a2a; border-radius: 8px;
      padding: 10px 12px; font-size: 13px; color: #f87171; margin-bottom: 16px;
      display: none;
    }
    .spinner {
      display: inline-block; width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,.3); border-top-color: #fff;
      border-radius: 50%; animation: spin .6s linear infinite;
      vertical-align: middle; margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .ajuda { color: #9aa4b2; font-size: 12px; line-height: 1.5; }
    button.link {
      background: none; border: none; color: #9aa4b2; text-decoration: underline;
      cursor: pointer; font-size: 12px; padding: 6px 0; width: auto; margin-top: 4px;
    }
    button.secundario {
      background: #2a3140; color: #d7dde7; font-size: 13px; padding: 8px 10px;
      width: auto; margin-right: 6px;
    }
  </style>
</head>
<body>
  <div class="logo">MaximusHub</div>
  <div class="subtitle">Print Client v<span id="version">1.0.0</span></div>

  <div class="card">
    <div class="error" id="error"></div>
    <div>
      <label>E-mail</label>
      <input type="email" id="email" placeholder="seu@email.com" autocomplete="email" />
    </div>
    <div>
      <label>Senha</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />
    </div>
    <button id="btn" onclick="fazerLogin()">Entrar</button>

    <!-- ══════════════════════════════════════════════════════════════════
         ETAPA 2 — o código do segundo fator.
         Fica escondida até o Hub pedir. O MESMO campo aceita o número do
         app, o código por e-mail/WhatsApp e o código de recuperação: é o
         servidor que descobre o que é, e quem está no balcão digita o que
         tem em mãos.
         ══════════════════════════════════════════════════════════════════ -->
    <div id="etapa-codigo" style="display:none">
      <div>
        <label>Código de verificação</label>
        <input id="codigo" inputmode="numeric" autocomplete="one-time-code"
               placeholder="000000" maxlength="20" />
      </div>
      <div id="ajuda-codigo" class="ajuda"></div>
      <button id="btn-codigo" onclick="enviarCodigo()">Confirmar</button>
      <div id="reenviar" style="margin-top:10px"></div>
      <div class="ajuda" style="margin-top:10px">
        Este computador será lembrado — o código não será pedido de novo nele.
      </div>
      <button class="link" onclick="voltarParaSenha()">voltar</button>
    </div>
  </div>

  <script>
    const btn   = document.getElementById('btn')
    const err   = document.getElementById('error')

    const etapaCodigo = document.getElementById('etapa-codigo')
    const btnCodigo   = document.getElementById('btn-codigo')

    /* Enter envia a etapa que estiver na tela. */
    document.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return
      if (etapaCodigo.style.display === 'none') fazerLogin()
      else enviarCodigo()
    })

    async function fazerLogin () {
      const email    = document.getElementById('email').value.trim()
      const password = document.getElementById('password').value
      if (!email || !password) return mostrarErro('Preencha e-mail e senha.')

      btn.disabled = true
      btn.innerHTML = '<span class="spinner"></span>Entrando...'
      err.style.display = 'none'

      const res = await window.hub.login({ email, password })
      if (res.success) {
        btn.innerHTML = '✓ Conectado!'
        return
      }

      /* O Hub pediu o segundo fator: a senha estava certa. */
      if (res.precisaCodigo) {
        mostrarEtapaDoCodigo(res)
        return
      }

      btn.disabled = false
      btn.innerHTML = 'Entrar'
      mostrarErro(res.message || 'Erro ao conectar.')
    }

    function mostrarEtapaDoCodigo (res) {
      document.getElementById('email').disabled = true
      document.getElementById('password').disabled = true
      btn.style.display = 'none'
      etapaCodigo.style.display = 'block'
      err.style.display = 'none'

      const partes = []
      if (res.expiraEmMin) partes.push(`O código vale por ${res.expiraEmMin} minutos.`)
      if (res.backupDisponiveis) partes.push('Você também pode usar um código de recuperação.')
      document.getElementById('ajuda-codigo').textContent = partes.join(' ')

      /* Só quem depende de ENVIO ganha botão — o código do app já está lá. */
      const area = document.getElementById('reenviar')
      area.innerHTML = ''
      for (const metodo of res.metodosParaEnviar || []) {
        const b = document.createElement('button')
        b.className = 'secundario'
        b.textContent = `Enviar por ${metodo.rotulo}`
        b.onclick = () => reenviar(metodo.id, b)
        area.appendChild(b)
      }

      document.getElementById('codigo').focus()
    }

    async function enviarCodigo () {
      const codigo = document.getElementById('codigo').value.trim()
      if (!codigo) return mostrarErro('Digite o código.')

      btnCodigo.disabled = true
      btnCodigo.innerHTML = '<span class="spinner"></span>Confirmando...'
      err.style.display = 'none'

      const res = await window.hub.loginCodigo({ codigo })
      if (res.success) {
        btnCodigo.innerHTML = '✓ Conectado!'
        return
      }

      btnCodigo.disabled = false
      btnCodigo.innerHTML = 'Confirmar'
      let msg = res.message || 'Código inválido.'
      if (res.tentativasRestantes !== undefined) {
        msg += ` (${res.tentativasRestantes} tentativa(s) restante(s))`
      }
      mostrarErro(msg)
      /* Desafio morto: a pessoa precisa recomeçar, e tem de saber disso. */
      if (res.expirou) voltarParaSenha()
    }

    async function reenviar (methodId, botao) {
      const rotuloOriginal = botao.textContent
      botao.disabled = true
      botao.textContent = 'Enviando...'
      const res = await window.hub.loginReenviar({ methodId })
      botao.textContent = res.success ? 'Enviado ✓' : rotuloOriginal
      botao.disabled = false
      if (!res.success) mostrarErro(res.message || 'Não foi possível enviar o código.')
    }

    function voltarParaSenha () {
      etapaCodigo.style.display = 'none'
      btn.style.display = 'block'
      btn.disabled = false
      btn.innerHTML = 'Entrar'
      document.getElementById('email').disabled = false
      document.getElementById('password').disabled = false
      document.getElementById('codigo').value = ''
    }

    function mostrarErro (msg) {
      err.textContent = msg
      err.style.display = 'block'
    }
  </script>
</body>
</html>
